# The Android CMake build shells out to vcpkg, which needs this to locate the NDK for its own
# compiler-hash probe -- see docs/building.md. ANDROID_HOME is not enough.
# Overridable from the environment; this default matches the ndkVersion pinned in app/build.gradle.
ANDROID_NDK_HOME=D:/Programs/Android/Sdk/ndk/28.2.13676358

# The SDK ships CMake 3.22.1 while the engine requires 3.25+, so AGP must be told about a newer
# install. That is configured per machine via `cmake.dir` in android/local.properties, which is not
# committed -- see docs/building.md for the two lines it needs.

# -Djdk.net.unixdomain.tmpdir is what makes the daemon start at all on some Windows hosts.
#
# Gradle's daemon connection is a plain TCP socket, but reading it goes through Selector.open(),
# which on Windows is WEPollSelectorImpl -- and that builds an internal java.nio.channels.Pipe out
# of an AF_UNIX socket pair. The socket file is created under jdk.net.unixdomain.tmpdir, which
# defaults to java.io.tmpdir, i.e. somewhere under %LOCALAPPDATA%. When AF_UNIX sockets cannot be
# created there, connect0 fails with "Invalid argument: connect" and Gradle reports the useless
# "Unable to establish loopback connection" / "Could not receive a message from the daemon".
#
# Measured on this host: any path under C:\Users\<user>\AppData (Local *and* Roaming) fails, while
# C:\Temp, C:\Users\<user>\anything-else and D:\ all succeed. So it is the location, not the path
# length and not the 8.3 short name -- and not the JDK version either, since 17 and 21 behave the
# same. Redirected or scanned AppData is the likely cause.
#
# The fix is NOT settable from here. Measured: putting -Djdk.net.unixdomain.tmpdir in
# org.gradle.jvmargs does not reach the daemon (the string never appears in the daemon log), and
# GRADLE_OPTS only reaches the launcher -- which turns "Unable to establish loopback connection"
# into "Could not receive a message from the daemon" and fixes nothing. What works is redirecting
# TMP/TEMP in the environment before invoking the wrapper, because the daemon inherits them:
#
#   export TMP='C:\Temp\gradle' TEMP='C:\Temp\gradle'
#
# See docs/building.md. Hosts that can create AF_UNIX sockets under AppData need none of this.
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=false

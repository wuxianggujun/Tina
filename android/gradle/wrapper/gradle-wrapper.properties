distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Tencent's mirror rather than services.gradle.org, because this download is ~130 MB and is the
# slowest single step of a first build from mainland China.
#
# Unlike the dependency repositories in settings.gradle, this has NO fallback: the wrapper accepts one
# URL, so if the mirror is unreachable the download fails outright rather than trying elsewhere. The
# official URL is therefore kept below, commented, as the one-line revert -- and note that
# maven.aliyun.com does not mirror Gradle distributions at all (it answers 404 for this path), so
# Aliyun is not an alternative here even though it is the mirror used for artifacts.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.13-all.zip
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

apply plugin: 'com.android.application'

android {
    namespace 'dev.tina'
    compileSdk 36
    ndkVersion '28.2.13676358'


    defaultConfig {
        applicationId 'dev.tina'
        // 24 matches the ANativeWindow-era floor the engine's Android backend targets.
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1'

        externalNativeBuild {
            cmake {
                targets 'tina_platform_android_jni'

                // Mirrors the compile-only Android configuration documented in docs/building.md.
                // GLFW cannot build for Android, and desktop/editor_app require it, so they drop out.
                // The vcpkg wiring (toolchain chainload and per-ABI triplet) lives in
                // app/CMakeLists.txt instead of here, because the triplet depends on ANDROID_ABI and
                // AGP configures each ABI separately -- picking one here would give the other ABI the
                // wrong dependencies.
                def cmakeArguments = ['-DTINA_BUILD_TESTING=OFF',
                                      '-DTINA_BUILD_EXAMPLES=OFF',
                                      '-DTINA_BUILD_BENCHMARKS=OFF',
                                      '-DTINA_BUILD_DOCS=OFF',
                                      '-DTINA_BUILD_PLATFORM_GLFW=OFF',
                                      '-DTINA_BUILD_SHADERS=OFF',
                                      '-DTINA_BUILD_PHYSICS2D=OFF',
                                      '-DTINA_BUILD_AUDIO_MINIAUDIO=OFF',
                                      // ON so UI text is readable. Without it every glyph falls back to a
                                      // solid quad, which makes a menu of named scenes pointless. The
                                      // matching vcpkg manifest feature is selected in app/CMakeLists.txt,
                                      // because it has to be set before project() runs.
                                      '-DTINA_BUILD_UI_FREETYPE=ON',
                                      '-DTINA_BUILD_UI_UIA=OFF',
                                      // The default already excludes it (PROJECT_IS_TOP_LEVEL is
                                      // false through add_subdirectory), but stated so the intent is
                                      // greppable: a phone never runs the editor, and building it
                                      // cross-compiled ~9.5k lines of authoring code for arm64.
                                      '-DTINA_BUILD_EDITOR=OFF']

                // The renderer is opt-in via -Ptina.shaderc=<path to a host shaderc.exe>, because
                // shaderc is a build-HOST tool that this cross build cannot produce: built here it
                // would target Android and refuse to run. Without it the APK still installs and the
                // bridge still runs, the screen is just blank. See docs/building.md.
                //
                // Accumulated into one list because successive arguments() calls replace rather than
                // append, so a second call would silently drop everything above it.
                if (project.hasProperty('tina.shaderc')) {
                    cmakeArguments += ['-DTINA_BUILD_RENDER_BGFX=ON',
                                       '-DTINA_RENDER_BGFX_MOBILE_SHADERS=ON',
                                       '-DTINA_BGFX_SHADERC_EXECUTABLE=' +
                                               project.property('tina.shaderc').toString().replace('\\', '/')]
                } else {
                    cmakeArguments += ['-DTINA_BUILD_RENDER_BGFX=OFF']
                }

                arguments cmakeArguments as String[]
            }
        }

        ndk {
            // Only the two ABIs the engine has actually been verified on. Adding armeabi-v7a or x86
            // would ship untested binaries.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            // A local wrapper, not the repository root: pointing AGP at the root makes it pick up the
            // sibling CMakeSettings.json (a Visual Studio file) and fail configuration. See the
            // comment in app/CMakeLists.txt.
            path 'CMakeLists.txt'
            version '3.22.1+'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // Every measurement before this existed came from the debug build, which is compiled -O0 with
            // assertions live -- so any performance number taken from it says nothing about shipped
            // behaviour. AGP passes CMAKE_BUILD_TYPE=Release for this variant, which is what actually
            // turns on optimisation in the native half.
            debuggable false
            // No minify: there is no Java to shrink worth speaking of (four small classes), and R8 would
            // rename the very methods RegisterNatives resolves by name at load time. Keeping it off means
            // an unsigned release build behaves like the debug one apart from optimisation.
            minifyEnabled false
            // Native symbols are kept. A stripped .so turns a device crash into a hex address, and the
            // defects this port has produced were only diagnosable from named frames.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

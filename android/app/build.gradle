apply plugin: 'com.android.application'

// Where the cooked catalog is staged before AGP packages it.
//
// A generated directory under build/, registered as an extra assets source, rather than writing
// into src/main/assets: the catalog is a build output, and a tool that writes into the source tree
// leaves a stale copy behind whenever the recipe changes name or is removed.
//
// The catalog goes into a `content/` subdirectory of that source root, so the APK carries
// assets/content/. That is what makes the device layout identical to desktop: the activity extracts
// the whole assets tree to one directory and calls it the content root, so content asking the root
// for "content" finds the catalog exactly as it does beside a desktop executable.
def tinaAssetsRoot = layout.buildDirectory.dir('generated/tina/assets').get().asFile
def tinaCatalogRoot = new File(tinaAssetsRoot, 'content')
def tinaRecipe = file('content/android.recipe')

// Cooking is opt-in via -Ptina.assetc=<path to a host tina_assetc>, for the same reason the
// renderer is opt-in via -Ptina.shaderc: the cooker is a build-HOST tool that this cross build
// cannot produce -- built here it would target Android and refuse to run on the machine doing the
// build. Without it the APK still installs and runs, it just ships no content, and the engine's
// content root stays empty rather than pointing at a directory that cannot exist.
//
// Cooking on the host rather than on first launch is the whole performance point: a device then
// pays one extraction of already-cooked bytes instead of running the cooker on a phone CPU.
if (project.hasProperty('tina.assetc')) {
    def assetc = project.property('tina.assetc').toString()

    def cookTinaContent = tasks.register('cookTinaContent', Exec) {
        description = 'Cooks the APK\'s asset catalog with a host tina_assetc.'
        // Declared so an unchanged recipe does not re-cook, and a changed one does. Without the
        // output declaration Gradle would call this up to date while the directory was missing.
        inputs.file(tinaRecipe)
        inputs.file(assetc)
        outputs.dir(tinaCatalogRoot)

        // tina_assetc refuses a --out that already exists ("staging root already exists"), because a
        // pre-existing directory is how a stale catalog gets silently merged into a fresh one. So the
        // destination is removed first rather than reused.
        doFirst {
            delete(tinaCatalogRoot)
            tinaCatalogRoot.parentFile.mkdirs()
        }
        commandLine assetc, '--out', tinaCatalogRoot.absolutePath, '--recipe', tinaRecipe.absolutePath
    }

    // Ordering is declared, not hoped for. A CMake POST_BUILD inside externalNativeBuild has no
    // relationship to asset merging, so the cook could legitimately run after the assets were
    // already packaged -- which presents as an APK that ships the *previous* build's catalog.
    //
    // Matched by name rather than by AGP task type so this does not depend on an internal class:
    // mergeDebugAssets / mergeReleaseAssets are the tasks that consume every assets source set.
    // Verified with AGP 8.13.2: `:app:mergeDebugAssets` runs `:app:cookTinaContent` first, and the
    // three files it leaves in intermediates/assets/debug/mergeDebugAssets/content/ are byte-identical
    // to a standalone host cook of the same recipe.
    tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
        dependsOn(cookTinaContent)
    }
}

android {
    namespace 'dev.tina'
    compileSdk 36
    ndkVersion '28.2.13676358'

    sourceSets {
        main {
            // Registered unconditionally, even when no cook task exists. AGP tolerates a missing
            // assets directory, and making the source set itself conditional would mean a build
            // without -Ptina.assetc configured a different project shape -- the kind of difference
            // that makes "works for me" builds.
            assets.srcDir tinaAssetsRoot
        }
    }

    defaultConfig {
        applicationId 'dev.tina'
        // 24 matches the ANativeWindow-era floor the engine's Android backend targets.
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1'

        externalNativeBuild {
            cmake {
                targets 'tina_platform_android_jni'

                // Mirrors the compile-only Android configuration documented in docs/building.md.
                // GLFW cannot build for Android, and desktop/editor_app require it, so they drop out.
                // The vcpkg wiring (toolchain chainload and per-ABI triplet) lives in
                // app/CMakeLists.txt instead of here, because the triplet depends on ANDROID_ABI and
                // AGP configures each ABI separately -- picking one here would give the other ABI the
                // wrong dependencies.
                def cmakeArguments = ['-DTINA_BUILD_TESTING=OFF',
                                      '-DTINA_BUILD_EXAMPLES=OFF',
                                      // Host tools (tina_assetc) cannot run when built for Android.
                                      // TINA_BUILD_TOOLS already defaults off under CMAKE_CROSSCOMPILING;
                                      // stated so a later change to that default cannot silently
                                      // start compiling two host executables for the wrong ABI.
                                      '-DTINA_BUILD_TOOLS=OFF',
                                      '-DTINA_BUILD_BENCHMARKS=OFF',
                                      '-DTINA_BUILD_DOCS=OFF',
                                      '-DTINA_BUILD_PLATFORM_GLFW=OFF',
                                      '-DTINA_BUILD_SHADERS=OFF',
                                      '-DTINA_BUILD_PHYSICS2D=OFF',
                                      '-DTINA_BUILD_AUDIO_MINIAUDIO=OFF',
                                      // ON so UI text is readable. Without it every glyph falls back to a
                                      // solid quad, which makes a menu of named scenes pointless. The
                                      // matching vcpkg manifest feature is selected in app/CMakeLists.txt,
                                      // because it has to be set before project() runs.
                                      '-DTINA_BUILD_UI_FREETYPE=ON',
                                      '-DTINA_BUILD_UI_UIA=OFF',
                                      // The default already excludes it (PROJECT_IS_TOP_LEVEL is
                                      // false through add_subdirectory), but stated so the intent is
                                      // greppable: a phone never runs the editor, and building it
                                      // cross-compiled ~9.5k lines of authoring code for arm64.
                                      '-DTINA_BUILD_EDITOR=OFF']

                // The renderer is opt-in via -Ptina.shaderc=<path to a host shaderc.exe>, because
                // shaderc is a build-HOST tool that this cross build cannot produce: built here it
                // would target Android and refuse to run. Without it the APK still installs and the
                // bridge still runs, the screen is just blank. See docs/building.md.
                //
                // Accumulated into one list because successive arguments() calls replace rather than
                // append, so a second call would silently drop everything above it.
                if (project.hasProperty('tina.shaderc')) {
                    cmakeArguments += ['-DTINA_BUILD_RENDER_BGFX=ON',
                                       '-DTINA_RENDER_BGFX_MOBILE_SHADERS=ON',
                                       '-DTINA_BGFX_SHADERC_EXECUTABLE=' +
                                               project.property('tina.shaderc').toString().replace('\\', '/')]
                } else {
                    cmakeArguments += ['-DTINA_BUILD_RENDER_BGFX=OFF']
                }

                arguments cmakeArguments as String[]
            }
        }

        ndk {
            // Only the two ABIs the engine has actually been verified on. Adding armeabi-v7a or x86
            // would ship untested binaries.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            // A local wrapper, not the repository root: pointing AGP at the root makes it pick up the
            // sibling CMakeSettings.json (a Visual Studio file) and fail configuration. See the
            // comment in app/CMakeLists.txt.
            path 'CMakeLists.txt'
            version '3.22.1+'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // Every measurement before this existed came from the debug build, which is compiled -O0 with
            // assertions live -- so any performance number taken from it says nothing about shipped
            // behaviour. AGP passes CMAKE_BUILD_TYPE=Release for this variant, which is what actually
            // turns on optimisation in the native half.
            debuggable false
            // No minify: there is no Java to shrink worth speaking of (four small classes), and R8 would
            // rename the very methods RegisterNatives resolves by name at load time. Keeping it off means
            // an unsigned release build behaves like the debug one apart from optimisation.
            minifyEnabled false
            // Native symbols are kept. A stripped .so turns a device crash into a hex address, and the
            // defects this port has produced were only diagnosable from named frames.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}
